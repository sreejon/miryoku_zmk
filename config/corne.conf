# The nRF52840 used on nice!nano/nice!nano v2 defaults to 0 dBm output.
# The peripheral half's key events are sent over BLE to the central half,
# so a weak link shows up as dropped presses on that half. +8 dBm is the
# nRF52840 maximum and is what Typeractive ships in its Corne config.
# Flash both halves after changing this.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Give the split link a little more headroom for bursts and retries
# before events start being dropped.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=20

# If presses are still lost, this removes the peripheral's idle connection
# latency so it services every connection event (higher battery drain).
# CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0